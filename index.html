<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0c11" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DateU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>DateU</title>
    <!-- Launch screen: shown instantly (dark, no white flash) until the app has loaded -->
    <style>
      html, body { background: #0c0c11; }
      #launch { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0c0c11; }
      #launch .logo { font: 800 40px/1 'Poppins', system-ui, sans-serif; background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.02em; }
      #launch .dots { display: flex; gap: 6px; }
      #launch .dots span { width: 6px; height: 6px; border-radius: 50%; background: #ff416c; opacity: .3; animation: launch-dot 1s infinite ease-in-out; }
      #launch .dots span:nth-child(2) { animation-delay: .15s } #launch .dots span:nth-child(3) { animation-delay: .3s }
      @keyframes launch-dot { 50% { opacity: 1; transform: translateY(-3px) } }
    </style>
  </head>
  <body>
    <div id="root"><div id="launch"><div class="logo">DateU</div><div class="dots"><span></span><span></span><span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
